<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maíz animado · Simulador Botánico Babylon.js (Standalone)</title>

  <!-- Babylon.js 6.49.0 y Babylon GUI por CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.49.0/babylon.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs-gui/6.49.0/babylon.gui.min.js"></script>

  <style>
    :root {
      --bg: #bde7f4;
      --ink: #2a3417;
      --panel: rgba(255, 252, 236, 0.92);
      --line: #2a3417;
      --accent: #e8a317;
      --accent-hover: #d18d07;
      --chip-bg: rgba(232, 163, 23, 0.18);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #f5f0d8;
        --panel: rgba(32, 38, 24, 0.92);
        --line: #f5f0d8;
        --chip-bg: rgba(232, 163, 23, 0.28);
      }
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
    }
    .shortcuts-pill {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 252, 236, 0.88);
      border: 1.5px solid #2a3417;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 700;
      color: #2a3417;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 12px rgba(42, 52, 23, 0.12);
      pointer-events: none;
      opacity: 0.85;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .shortcuts-pill {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div class="shortcuts-pill">
    🌽 <b>Consolas 3D Integradas</b> · [Espacio] Play/Pausa · [R] Rotación · [H] Paneles · [1-5] Vistas Cámara
  </div>

  <script>
    // Iniciar aplicación autónoma compatible con doble-clic directo en navegador
    const B = BABYLON;
    const V = (x, y, z) => new B.Vector3(x, y, z);
    const clamp01 = (v) => Math.max(0, Math.min(1, v));

    // -------------------------------------------------------------------------
    // 1. CONFIGURACIÓN Y AGROFISIOLOGÍA DE ZEA MAYS L. (RAZA CHALQUEÑO)
    // -------------------------------------------------------------------------
    const CFG = {
      presionBase: 780.0,
      tBase: 8.0,
      tCorteSuperior: 32.0,
      gddEmergencia: 80.0,
      gddV2: 90.0,
      gddV4: 210.0,
      gddV6: 360.0,
      gddV8: 540.0,
      gddV12: 760.0,
      gddVT: 1020.0,
      gddR1: 1080.0,
      gddR2: 1260.0,
      gddR3: 1380.0,
      gddR4: 1470.0,
      gddR5: 1620.0,
      gddR6: 1880.0,
      pmp: 12.0,
      cc: 32.0,
      saturacion: 45.0,
      umbralEncharcamiento: 38.0
    };

    function etapaDe(gdd) {
      if (gdd < CFG.gddV2) return "VE (Emergencia)";
      if (gdd < CFG.gddV4) return "V2 (2ª Hoja Desplegada)";
      if (gdd < CFG.gddV6) return "V4 (Plántula Establecida)";
      if (gdd < CFG.gddV8) return "V6 (Inicio Elongación Caña)";
      if (gdd < CFG.gddV12) return "V8 (Crecimiento Rápido)";
      if (gdd < CFG.gddVT) return "V12 (Pre-Floración)";
      if (gdd < CFG.gddR1) return "VT (Floración / Panoja)";
      if (gdd < CFG.gddR2) return "R1 (Jilote Femenino)";
      if (gdd < CFG.gddR3) return "R2 (Ampolla / Blister)";
      if (gdd < CFG.gddR4) return "R3 (Leche / ELOTE)";
      if (gdd < CFG.gddR5) return "R4 (Pastoso / Dough)";
      if (gdd < CFG.gddR6) return "R5 (Dentado / Dent)";
      return "R6 (Madurez Fisiológica)";
    }

    const clima = {
      temperatura: 24,
      humedad: 62,
      presion: 780,
      hora: 13.5,
      nubosidad: 20,
      viento: 2.5,
      lluvia: 0,
      co2: 420,
      humedadSuelo: 32,
      phSuelo: 6.4,
      pm25: 12
    };

    const estadoCrecimiento = {
      dia: 1.0,
      diaEntero: 1,
      timeLapseActivo: false,
      velocidad: 3.0,
      gdd: 0.0,
      biomasa: 0.15,
      salud: 1.0,
      etapa: "SEMILLA (Siembra)",
      estaMuerta: false,
      causaMuerte: null,
      acameGrados: 0,
      sequia: 0,
      frio: 0,
      amarillamiento: 0,
      antocianina: 0,
      degradacion: 0
    };

    // 10 Escenarios predefinidos
    const ESCENARIOS = [
      { nombre: "Temporal Óptimo", vals: { temperatura: 24, humedad: 62, viento: 2.5, lluvia: 0, humedadSuelo: 32, phSuelo: 6.4 } },
      { nombre: "Canícula / Sequía", vals: { temperatura: 35, humedad: 22, viento: 4.0, lluvia: 0, humedadSuelo: 11, phSuelo: 6.5 } },
      { nombre: "Helada Otoño", vals: { temperatura: -3, humedad: 85, viento: 1.0, lluvia: 0, humedadSuelo: 24, phSuelo: 6.4 } },
      { nombre: "Tormenta / Acame", vals: { temperatura: 17, humedad: 96, viento: 21.0, lluvia: 40, humedadSuelo: 52, phSuelo: 6.2 } },
      { nombre: "Suelo Ácido (Al)", vals: { temperatura: 23, humedad: 58, viento: 3.0, lluvia: 0, humedadSuelo: 30, phSuelo: 4.3 } },
      { nombre: "Ola de Calor", vals: { temperatura: 42, humedad: 28, viento: 2.0, lluvia: 0, humedadSuelo: 18, phSuelo: 6.5 } },
      { nombre: "Atardecer Valles", vals: { temperatura: 21, humedad: 60, viento: 3.5, lluvia: 0, humedadSuelo: 30, phSuelo: 6.5, hora: 18.2 } },
      { nombre: "Suelo Alcalino", vals: { temperatura: 24, humedad: 55, viento: 2.0, lluvia: 0, humedadSuelo: 28, phSuelo: 8.5 } },
      { nombre: "Invernadero CO₂", vals: { temperatura: 26, humedad: 68, viento: 0.5, lluvia: 0, co2: 1200, humedadSuelo: 34, phSuelo: 6.4 } },
      { nombre: "Noche Fresca", vals: { temperatura: 12, humedad: 78, viento: 1.5, lluvia: 0, humedadSuelo: 30, phSuelo: 6.4, hora: 23 } }
    ];

    function calcularMetricas() {
      const es = 0.6108 * Math.exp((17.27 * clima.temperatura) / (clima.temperatura + 237.3));
      const ea = (es * clima.humedad) / 100;
      const vpd = Math.max(0, es - ea);
      const estresSuelo = clima.humedadSuelo < 26 ? clamp01((26 - clima.humedadSuelo) / (26 - CFG.pmp)) : 0;
      const estresVPD = vpd > 1.6 ? clamp01((vpd - 1.6) / 2.4) : 0;
      const hidrico = clamp01(Math.max(estresSuelo, estresVPD * 0.7));
      const calor = clima.temperatura > 28 ? clamp01((clima.temperatura - 28) / (45 - 28)) : 0;
      const frio = clima.temperatura < 8 ? clamp01((8 - clima.temperatura) / 12) : 0;
      const ench = clima.humedadSuelo > CFG.umbralEncharcamiento ? clamp01((clima.humedadSuelo - 38) / 20) : 0;
      const pH = clima.phSuelo < 5.8 ? clamp01((5.8 - clima.phSuelo) / 2.3) : (clima.phSuelo > 7.5 ? clamp01((clima.phSuelo - 7.5) / 1.5) : 0);
      const mec = clamp01(Math.pow(clima.viento / 16, 2));
      const salud = clamp01(1 - (0.3 * hidrico + 0.2 * calor + 0.15 * frio + 0.15 * ench + 0.1 * pH + 0.1 * mec));

      return { vpd, hidrico, calor, frio, ench, pH, mec, salud };
    }

    // -------------------------------------------------------------------------
    // 2. ESCENA, CÁMARA, LUCES Y MATERIALES ESTILIZADOS
    // -------------------------------------------------------------------------
    const canvas = document.getElementById("renderCanvas");
    const engine = new B.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    const scene = new B.Scene(engine);
    scene.clearColor = new B.Color4(0.74, 0.90, 0.97, 1);

    const cam = new B.ArcRotateCamera("cam", -Math.PI / 2.0, Math.PI / 2.28, 12.0, V(0, 3.0, -0.3), scene);
    cam.lowerRadiusLimit = 2.5;
    cam.upperRadiusLimit = 25.0;
    cam.upperBetaLimit = Math.PI / 2.05;
    cam.wheelPrecision = 28;
    cam.attachControl(canvas, true);
    cam.useAutoRotationBehavior = false;
    if (cam.autoRotationBehavior) cam.autoRotationBehavior.idleRotationSpeed = 0.20;

    const hemi = new B.HemisphericLight("hemi", V(0, 1, 0), scene);
    hemi.intensity = 0.85;
    hemi.groundColor = new B.Color3(0.75, 0.65, 0.45);

    const sun = new B.DirectionalLight("sun", V(-0.5, -1, -0.4), scene);
    sun.position = V(6, 12, 5);
    sun.intensity = 0.65;

    const sg = new B.ShadowGenerator(1024, sun);
    sg.useBlurExponentialShadowMap = true;
    sg.blurKernel = 24;
    sg.setDarkness(0.5);

    const mat = (hex, em = 0.45, spec = 0) => {
      const m = new B.StandardMaterial("m_" + hex, scene);
      const c = B.Color3.FromHexString(hex);
      m.diffuseColor = c;
      m.emissiveColor = c.scale(em);
      m.specularColor = new B.Color3(spec, spec, spec);
      m.backFaceCulling = false;
      return m;
    };
    const ink = (mesh, w = 0.02, col = "#25330f") => {
      mesh.renderOutline = true;
      mesh.outlineWidth = w;
      mesh.outlineColor = B.Color3.FromHexString(col);
      return mesh;
    };
    const cast = (mesh) => {
      sg.addShadowCaster(mesh);
      return mesh;
    };

    // Suelo podio cilíndrico caricatura
    const grass = B.MeshBuilder.CreateCylinder("grass", { diameter: 14, height: 0.3, tessellation: 56 }, scene);
    grass.position.y = -0.15;
    grass.material = mat("#8fd44a", 0.5);
    grass.receiveShadows = true;
    ink(grass, 0.03);

    const soil = B.MeshBuilder.CreateCylinder("soil", { diameter: 13.7, height: 1.2, tessellation: 56 }, scene);
    soil.position.y = -0.9;
    soil.material = mat("#8a5a2b", 0.4);

    const mound = B.MeshBuilder.CreateSphere("mound", { diameter: 1.9 }, scene);
    mound.scaling.y = 0.22;
    mound.material = mat("#7a4c22", 0.4);
    mound.receiveShadows = true;
    ink(mound, 0.03);

    const puddle = B.MeshBuilder.CreateCylinder("puddle", { diameter: 1.6, height: 0.01, tessellation: 32 }, scene);
    puddle.position.y = 0.022;
    const puddleMat = new B.StandardMaterial("puddleMat", scene);
    puddleMat.diffuseColor = new B.Color3(0.12, 0.18, 0.22);
    puddleMat.alpha = 0.0;
    puddle.material = puddleMat;

    // Briznas de pasto 3D
    const blade = B.MeshBuilder.CreateCylinder("blade", { diameterTop: 0, diameterBottom: 0.12, height: 0.5, tessellation: 5 }, scene);
    blade.material = mat("#5fbf2e");
    blade.isVisible = false;
    for (let i = 0; i < 80; i++) {
      const a = (i * 7.13) % (Math.PI * 2);
      const r = 1.2 + ((i * 13.7) % 5.2);
      const b = blade.createInstance("b" + i);
      b.position.set(Math.cos(a) * r, 0.1, Math.sin(a) * r);
      b.scaling.y = 0.6 + ((i * 3.3) % 1.0);
      b.rotation.set((((i % 7) - 3.5) / 7) * 0.5, 0, (((i % 5) - 2.5) / 5) * 0.5);
    }

    // Sol y halo
    const sunMesh = B.MeshBuilder.CreateSphere("sunM", { diameter: 3 }, scene);
    sunMesh.position.set(-18, 13, -16);
    sunMesh.material = mat("#ffd53a", 1);
    const haloMesh = B.MeshBuilder.CreateSphere("haloM", { diameter: 4.6 }, scene);
    haloMesh.position.copyFrom(sunMesh.position);
    const haloMat = mat("#ffe680", 1);
    haloMat.alpha = 0.3;
    haloMesh.material = haloMat;

    // Nubes
    const clouds = [];
    const matCloud = mat("#ffffff", 0.85);
    [[-12, 10, -8, 1.2], [10, 11, -12, 1.5], [14, 9, 6, 1.0], [-8, 12, 12, 1.3]].forEach(([x, y, z, s]) => {
      const n = new B.TransformNode("c", scene);
      n.position.set(x, y, z);
      n.scaling.setAll(s);
      [[0, 0, 0, 2.2], [1.4, -0.2, 0.2, 1.7], [-1.4, -0.2, 0, 1.6], [0.5, 0.5, 0, 1.5]].forEach(([ea, eb, ec, ed]) => {
        const sph = B.MeshBuilder.CreateSphere("cs", { diameter: ed, segments: 10 }, scene);
        sph.position.set(ea, eb, ec);
        sph.material = matCloud;
        sph.parent = n;
      });
      clouds.push(n);
    });

    // -------------------------------------------------------------------------
    // 3. GENERADOR DEL MAÍZ ESTILIZADO PROCEDURAL
    // -------------------------------------------------------------------------
    const plantRoot = new B.TransformNode("plantRoot", scene);
    let leaves = [];
    let tasselNode = null;
    let stalkMesh = null;
    let nodeMeshes = [];
    let braceRoots = [];
    let earNodes = [];

    const stalkMat = mat("#7ccc3c", 0.45);
    const nodeMat = mat("#3f9a22", 0.45);
    const huskMat = mat("#6fc23a", 0.45);
    const ribMat = mat("#a6e063", 0.45);
    const greenMats = ["#5cb82e", "#4aa326", "#7bd13f"].map((hex) => mat(hex, 0.45));

    function kernelTex(hex) {
      const W = 256, Ht = 512, t = new B.DynamicTexture("kt", { width: W, height: Ht }, scene, true), c = t.getContext();
      c.fillStyle = hex === "#ffd21f" ? "#d99a00" : hex;
      c.fillRect(0, 0, W, Ht);
      const cols = 16, rows = 22, cw = W / cols, rh = Ht / rows;
      for (let r = 0; r < rows; r++) {
        for (let i = 0; i < cols; i++) {
          const x = i * cw + cw / 2, y = r * rh + rh / 2;
          const g = c.createRadialGradient(x - cw * 0.12, y - rh * 0.15, 1, x, y, cw * 0.6);
          if (hex === "#fff09a") {
            g.addColorStop(0, "#ffffff"); g.addColorStop(0.55, "#fff09a"); g.addColorStop(1, "#e6d87e");
          } else if (hex.includes("38250b")) {
            g.addColorStop(0, "#5a3d1c"); g.addColorStop(0.55, "#3d250d"); g.addColorStop(1, "#201205");
          } else {
            g.addColorStop(0, "#fff09a"); g.addColorStop(0.55, "#ffd21f"); g.addColorStop(1, "#f0a800");
          }
          c.fillStyle = g;
          c.beginPath();
          c.ellipse(x, y, cw * 0.46, rh * 0.46, 0, 0, 7);
          c.fill();
        }
      }
      t.update();
      return t;
    }
    const cobMat = new B.StandardMaterial("cobMat", scene);
    cobMat.diffuseTexture = kernelTex("#ffd21f");
    cobMat.emissiveColor = new B.Color3(0.35, 0.28, 0.04);

    function construirMaiz(H = 6.6, numHojas = 8, espiga = true, elotes = true, granoHex = "#ffd21f") {
      if (stalkMesh) stalkMesh.dispose();
      nodeMeshes.forEach((n) => n.dispose()); nodeMeshes = [];
      braceRoots.forEach((r) => r.dispose()); braceRoots = [];
      leaves.forEach((l) => l.node.dispose()); leaves = [];
      earNodes.forEach((e) => e.dispose()); earNodes = [];
      if (tasselNode) tasselNode.dispose(); tasselNode = null;

      const P = (t) => V(0.22 * Math.sin(t * 2.6), t * H, 0.1 * Math.sin(t * 3.4 + 1));
      const rad = (t) => 0.2 * (1 - 0.45 * t) * Math.min(1.0, H / 5.5);

      // Tallo
      const pts = Array.from({ length: 25 }, (_, i) => P(i / 24));
      stalkMesh = B.MeshBuilder.CreateTube("stalk", { path: pts, radiusFunction: (i) => Math.max(0.04, rad(i / 24)), tessellation: 18, cap: B.Mesh.CAP_ALL }, scene);
      stalkMesh.material = stalkMat;
      stalkMesh.parent = plantRoot;
      ink(stalkMesh, 0.025);
      cast(stalkMesh);

      // Nudos
      const nNodes = Math.min(8, Math.max(1, Math.round(H * 1.25)));
      for (let k = 1; k <= nNodes; k++) {
        const t = k / (nNodes + 1.2);
        const n = B.MeshBuilder.CreateTorus("n", { diameter: 2 * rad(t) + 0.02, thickness: 0.07 * (H / 6.6), tessellation: 20 }, scene);
        n.position = P(t);
        n.material = nodeMat;
        n.parent = plantRoot;
        ink(n, 0.016, "#25330f");
        nodeMeshes.push(n);
      }

      // Raíces fúlcreas de doble nivel (brace roots)
      if (H >= 2.8) {
        const numTier1 = H >= 4.5 ? 6 : 4;
        for (let i = 0; i < numTier1; i++) {
          const a = i * ((Math.PI * 2) / numTier1) + 0.25;
          const rPts = [
            V(Math.cos(a) * 0.18, 0.42 * (H / 6.6), Math.sin(a) * 0.18),
            V(Math.cos(a) * 0.40, 0.22 * (H / 6.6), Math.sin(a) * 0.40),
            V(Math.cos(a) * 0.65, -0.08, Math.sin(a) * 0.65)
          ];
          const r = B.MeshBuilder.CreateTube("r1_" + i, { path: rPts, radius: 0.045, tessellation: 7 }, scene);
          r.material = mat("#c9a95c", 0.48);
          r.parent = plantRoot;
          ink(r, 0.014, "#25330f");
          braceRoots.push(r);
        }
        if (H >= 5.0) {
          for (let i = 0; i < 8; i++) {
            const a = i * ((Math.PI * 2) / 8) + 0.25 + (Math.PI / 8);
            const rPts = [
              V(Math.cos(a) * 0.19, 0.68 * (H / 6.6), Math.sin(a) * 0.19),
              V(Math.cos(a) * 0.48, 0.35 * (H / 6.6), Math.sin(a) * 0.48),
              V(Math.cos(a) * 0.78, -0.08, Math.sin(a) * 0.78)
            ];
            const r = B.MeshBuilder.CreateTube("r2_" + i, { path: rPts, radius: 0.038, tessellation: 7 }, scene);
            r.material = mat("#bfa052", 0.46);
            r.parent = plantRoot;
            ink(r, 0.013, "#25330f");
            braceRoots.push(r);
          }
        }
      }

      // Hojas
      for (let k = 0; k < numHojas; k++) {
        const t = 0.07 + k * (0.85 / Math.max(1, numHojas));
        const az = k * Math.PI + Math.sin(k * 1.7) * 0.5;
        const L = (3.1 - k * 0.14) * (H / 6.6);
        const droop = estadoCrecimiento.sequia > 0 ? 1.4 : 0.85 - k * 0.07;
        const w = (estadoCrecimiento.sequia > 0 ? 0.22 : 0.4) * (H / 6.6);

        // Vaina foliar de inserción en el nudo
        const collar = B.MeshBuilder.CreateCylinder("collar_" + k, {
          height: 0.14 * (H / 6.6),
          diameter: 2 * rad(t) + 0.024,
          tessellation: 16
        }, scene);
        collar.position = P(t);
        collar.material = greenMats[k % greenMats.length];
        collar.parent = plantRoot;
        ink(collar, 0.012, "#25330f");
        nodeMeshes.push(collar);

        const leafAz = new B.TransformNode("laz", scene);
        leafAz.parent = plantRoot;
        leafAz.position = P(t);
        leafAz.rotation.y = -az;

        const sway = new B.TransformNode("sway", scene);
        sway.parent = leafAz;

        const Lf = [], M = [], R = [];
        const ph = Math.random() * 6.28;
        const r0 = rad(t);
        for (let sIdx = 0; sIdx <= 16; sIdx++) {
          const s = sIdx / 16;
          const out = r0 + L * 0.9 * Math.pow(s, 0.9);
          const up = L * (0.5 * s - droop * s * s);
          const ww = w * Math.sin(Math.PI * Math.pow(s, 0.6));
          const rip = 0.045 * Math.sin(s * 16 + ph) * s;
          const curl = estadoCrecimiento.sequia * 0.35 * Math.sin(s * Math.PI);
          Lf.push(V(out, up - 0.4 * ww + rip + curl, ww));
          M.push(V(out, up, 0));
          R.push(V(out, up - 0.4 * ww - rip + curl, -ww));
        }
        const lf = B.MeshBuilder.CreateRibbon("lf", { pathArray: [Lf, M, R], sideOrientation: B.Mesh.DOUBLESIDE }, scene);
        lf.material = greenMats[k % greenMats.length];
        lf.parent = sway;
        ink(lf, 0.012);
        cast(lf);

        const rib = B.MeshBuilder.CreateTube("rib", { path: M.map((p) => p.add(V(0, 0.012, 0))), radius: 0.016, tessellation: 5 }, scene);
        rib.material = ribMat;
        rib.parent = sway;

        leaves.push({ node: sway, ph, amp: 0.05 + 0.02 * (L / 3) });
      }

      // Elotes
      if (elotes && H >= 4.0) {
        cobMat.diffuseTexture = kernelTex(granoHex);
        const makeEar = (tEar, az, tilt, peel) => {
          const eNode = new B.TransformNode("en", scene);
          eNode.parent = plantRoot;
          eNode.position = P(tEar);
          eNode.rotation.y = -az;

          const tl = new B.TransformNode("et", scene);
          tl.parent = eNode;
          tl.position.x = rad(tEar) + 0.02;
          tl.rotation.z = -tilt;

          const E = 1.5;
          const cob = B.MeshBuilder.CreateSphere("cob", { diameter: 1, segments: 24 }, scene);
          cob.scaling.set(0.5, 1.5, 0.5);
          cob.position.y = E / 2 + 0.05;
          cob.material = cobMat;
          cob.parent = tl;
          ink(cob, 0.02, "#6b4a00");
          cast(cob);

          const shank = B.MeshBuilder.CreateCylinder("sh", { diameter: 0.24, height: 0.25, tessellation: 10 }, scene);
          shank.position.y = 0.1;
          shank.material = huskMat;
          shank.parent = tl;

          const N = 6;
          for (let i = 0; i < N; i++) {
            const phi = (i * 2 * Math.PI) / N + 0.3;
            const pe = i < peel;
            const Lf = [], M = [], R = [];
            for (let k = 0; k <= 14; k++) {
              const s = k / 14;
              let y = 0.04 + s * E * 0.95;
              let rho = Math.max(0.12, 0.25 * Math.sqrt(Math.max(0, 1 - Math.pow((y - 0.8) / 0.75, 2))) + 0.045);
              const f = pe ? Math.max(0, (s - 0.3) / 0.7) : Math.max(0, (s - 0.8) / 0.2);
              rho += (pe ? 1 : 0.3) * Math.pow(f, 1.6);
              y -= (pe ? 0.6 : 0.05) * f * f;
              const al = (Math.PI / N) * 1.35 * (1 - 0.9 * Math.pow(s, 2.2));
              const pt = (a, rr) => V(rr * Math.cos(a), y, rr * Math.sin(a));
              Lf.push(pt(phi - al, rho)); M.push(pt(phi, rho + 0.03)); R.push(pt(phi + al, rho));
            }
            const h = B.MeshBuilder.CreateRibbon("h", { pathArray: [Lf, M, R], sideOrientation: B.Mesh.DOUBLESIDE }, scene);
            h.material = huskMat;
            h.parent = tl;
            ink(h, 0.012);
            cast(h);
          }

          for (let i = 0; i < 16; i++) {
            const a = i * 2.4, c = Math.cos(a), s = Math.sin(a), y0 = E * 0.98;
            const pts = [V(0, y0, 0), V(0.04 * c, y0 + 0.2, 0.04 * s), V(0.12 * c, y0 + 0.4, 0.12 * s), V(0.2 * c, y0 + 0.5, 0.2 * s)];
            const sk = B.MeshBuilder.CreateTube("sk", { path: pts, radius: 0.009, tessellation: 4 }, scene);
            sk.material = mat(i % 3 ? "#c8873a" : "#e8c46a");
            sk.parent = tl;
          }
          earNodes.push(eNode);
        };

        makeEar(0.46, Math.PI * 0.5, 0.5, 3);
        if (H >= 5.5) makeEar(0.62, -Math.PI * 0.5, 0.45, 3);
      }

      // Espiga
      if (espiga && H >= 3.8) {
        const tassel = new B.TransformNode("tassel", scene);
        tassel.parent = plantRoot;
        tassel.position = P(1);

        const spike = B.MeshBuilder.CreateTube("sp", { path: [V(0, 0, 0), V(0.03, 0.6, 0), V(0, 1.25, 0.04)], radius: 0.04, tessellation: 8, cap: B.Mesh.CAP_ALL }, scene);
        spike.material = mat("#b9c46a");
        spike.parent = tassel;
        ink(spike, 0.015);
        cast(spike);

        const anther = B.MeshBuilder.CreateSphere("an", { diameter: 1, segments: 6 }, scene);
        anther.scaling.set(0.05, 0.1, 0.05);
        anther.material = mat("#f2d95a", 0.6);
        anther.isVisible = false;

        for (let b = 0; b < 11; b++) {
          const sp = 0.2 + b * 0.085, a = b * 2.4, l = 1.05 - sp * 0.5, bPts = [];
          for (let k = 0; k <= 8; k++) {
            const s = k / 8, o = l * s;
            bPts.push(V(Math.cos(a) * o, sp * 1.2 + o * 0.45 - (0.55 * o * o) / l, Math.sin(a) * o));
          }
          const br = B.MeshBuilder.CreateTube("br", { path: bPts, radius: 0.02, tessellation: 5 }, scene);
          br.material = mat("#b9c46a");
          br.parent = tassel;
          for (let k = 2; k <= 8; k++) {
            const inst = anther.createInstance("anth");
            inst.parent = tassel;
            inst.position = bPts[k].add(V(0, -0.05, 0));
            inst.rotation.set(Math.random() * 0.8, Math.random() * 6, Math.random() * 0.8);
          }
        }
        tasselNode = tassel;
      }
    }

    construirMaiz(6.6, 8, true, true);

    // -------------------------------------------------------------------------
    // 4. PANELES ESPACIALES 3D CON BABYLON GUI
    // -------------------------------------------------------------------------
    const GUI = B.GUI;
    const panelesMesh = [];

    // Consola Central
    const pCenter = B.MeshBuilder.CreatePlane("pCenter", { width: 3.8, height: 2.35 }, scene);
    pCenter.position = V(0, 1.25, -2.2);
    pCenter.rotation.x = Math.PI / 8.0;
    panelesMesh.push(pCenter);
    const texCenter = GUI.AdvancedDynamicTexture.CreateForMesh(pCenter, 1720, 1060);

    const bgC = new GUI.Rectangle();
    bgC.width = "100%"; bgC.height = "100%"; bgC.cornerRadius = 18;
    bgC.color = "#2a3417"; bgC.thickness = 3; bgC.background = "rgba(255, 252, 236, 0.94)";
    texCenter.addControl(bgC);

    const stC = new GUI.StackPanel();
    stC.width = "95%";
    bgC.addControl(stC);

    const titC = new GUI.TextBlock();
    titC.text = "🌽 TIME-LAPSE & DESARROLLO FENOLÓGICO";
    titC.color = "#2a3417"; titC.fontSize = 28; titC.fontWeight = "bold"; titC.height = "42px";
    stC.addControl(titC);

    const gridInfo = new GUI.Grid();
    gridInfo.height = "38px"; gridInfo.addColumnDefinition(0.4); gridInfo.addColumnDefinition(0.6);
    stC.addControl(gridInfo);

    const lblDiaC = new GUI.TextBlock();
    lblDiaC.text = "DÍA: 1 / 240"; lblDiaC.color = "#8a5a2b"; lblDiaC.fontSize = 24; lblDiaC.fontWeight = "bold";
    lblDiaC.textHorizontalAlignment = GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
    gridInfo.addControl(lblDiaC, 0, 0);

    const lblEtapaC = new GUI.TextBlock();
    lblEtapaC.text = "Etapa: SEMILLA (Siembra)"; lblEtapaC.color = "#2a3417"; lblEtapaC.fontSize = 21; lblEtapaC.fontWeight = "bold";
    lblEtapaC.textHorizontalAlignment = GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
    gridInfo.addControl(lblEtapaC, 0, 1);

    const sliderDiaC = new GUI.Slider();
    sliderDiaC.minimum = 1; sliderDiaC.maximum = 240; sliderDiaC.value = 1;
    sliderDiaC.height = "34px"; sliderDiaC.color = "#e8a317"; sliderDiaC.background = "rgba(42,52,23,0.2)";
    sliderDiaC.onValueChangedObservable.add((val) => irADiaManual(Math.round(val)));
    stC.addControl(sliderDiaC);

    const ctrlGrid = new GUI.Grid();
    ctrlGrid.height = "52px"; ctrlGrid.addColumnDefinition(0.36);
    for (let i = 0; i < 4; i++) ctrlGrid.addColumnDefinition(0.12);
    ctrlGrid.addColumnDefinition(0.16);
    stC.addControl(ctrlGrid);

    const btnPlayC = GUI.Button.CreateSimpleButton("bp", "▶ INICIAR");
    btnPlayC.width = "96%"; btnPlayC.height = "40px"; btnPlayC.cornerRadius = 8;
    btnPlayC.color = "#022c22"; btnPlayC.background = "#10b981"; btnPlayC.fontSize = 19; btnPlayC.fontWeight = "bold";
    btnPlayC.onPointerUpObservable.add(() => togglePlay());
    ctrlGrid.addControl(btnPlayC, 0, 0);

    [1, 3, 6, 12].forEach((v, idx) => {
      const b = GUI.Button.CreateSimpleButton("bv" + v, v + "x");
      b.width = "90%"; b.height = "38px"; b.cornerRadius = 8; b.fontSize = 18; b.fontWeight = "bold";
      b.color = v === 3 ? "#0f172a" : "#2a3417"; b.background = v === 3 ? "#e8a317" : "rgba(232, 163, 23, 0.2)";
      b.onPointerUpObservable.add(() => { estadoCrecimiento.velocidad = v; });
      ctrlGrid.addControl(b, 0, 1 + idx);
    });

    const btnRep = GUI.Button.CreateSimpleButton("br", "↺ REPLANTAR");
    btnRep.width = "95%"; btnRep.height = "40px"; btnRep.cornerRadius = 8; btnRep.fontSize = 18; btnRep.fontWeight = "bold";
    btnRep.color = "#fff"; btnRep.background = "#0284c7";
    btnRep.onPointerUpObservable.add(() => replantar());
    ctrlGrid.addControl(btnRep, 0, 5);

    // Panel Izquierdo: 10 Escenarios + Sliders
    const pLeft = B.MeshBuilder.CreatePlane("pLeft", { width: 3.5, height: 3.4 }, scene);
    pLeft.position = V(-3.7, 2.5, -0.4); pLeft.rotation.y = Math.PI / 6.5;
    panelesMesh.push(pLeft);
    const texLeft = GUI.AdvancedDynamicTexture.CreateForMesh(pLeft, 1500, 1460);

    const bgL = new GUI.Rectangle();
    bgL.width = "100%"; bgL.height = "100%"; bgL.cornerRadius = 20;
    bgL.color = "#2a3417"; bgL.thickness = 3; bgL.background = "rgba(255, 252, 236, 0.94)";
    texLeft.addControl(bgL);

    const stL = new GUI.StackPanel(); stL.width = "94%"; bgL.addControl(stL);
    const titL = new GUI.TextBlock(); titL.text = "ESTACIÓN DE CONTROL AMBIENTAL";
    titL.color = "#2a3417"; titL.fontSize = 32; titL.fontWeight = "bold"; titL.height = "52px";
    stL.addControl(titL);

    const gridScn = new GUI.Grid();
    gridScn.height = "88px"; gridScn.addRowDefinition(0.5); gridScn.addRowDefinition(0.5);
    for (let i = 0; i < 5; i++) gridScn.addColumnDefinition(0.2);
    stL.addControl(gridScn);

    ESCENARIOS.forEach((esc, idx) => {
      const b = GUI.Button.CreateSimpleButton("sc_" + idx, esc.nombre);
      b.width = "95%"; b.height = "36px"; b.cornerRadius = 8; b.fontSize = 17; b.fontWeight = "bold";
      b.color = "#2a3417"; b.background = "rgba(232, 163, 23, 0.2)";
      b.onPointerUpObservable.add(() => {
        Object.assign(clima, esc.vals);
        actualizarSimulacion();
      });
      gridScn.addControl(b, Math.floor(idx / 5), idx % 5);
    });

    // Panel Derecho: Telemetría
    const pRight = B.MeshBuilder.CreatePlane("pRight", { width: 3.5, height: 3.4 }, scene);
    pRight.position = V(3.7, 2.5, -0.4); pRight.rotation.y = -Math.PI / 6.5;
    panelesMesh.push(pRight);
    const texRight = GUI.AdvancedDynamicTexture.CreateForMesh(pRight, 1500, 1460);

    const bgR = new GUI.Rectangle();
    bgR.width = "100%"; bgR.height = "100%"; bgR.cornerRadius = 20;
    bgR.color = "#2a3417"; bgR.thickness = 3; bgR.background = "rgba(255, 252, 236, 0.94)";
    texRight.addControl(bgR);

    const stR = new GUI.StackPanel(); stR.width = "94%"; bgR.addControl(stR);
    const titR = new GUI.TextBlock(); titR.text = "TELEMETRÍA BIOFÍSICA & ESTRÉS";
    titR.color = "#2a3417"; titR.fontSize = 32; titR.fontWeight = "bold"; titR.height = "52px";
    stR.addControl(titR);

    const lblSalud = new GUI.TextBlock();
    lblSalud.text = "Salud Fisiológica: 100%"; lblSalud.color = "#15803d"; lblSalud.fontSize = 26; lblSalud.fontWeight = "bold"; lblSalud.height = "40px";
    stR.addControl(lblSalud);

    const diagTxt = new GUI.TextBlock();
    diagTxt.text = "Estado: Fisiología y Fotosíntesis C4 Óptimas";
    diagTxt.color = "#2a3417"; diagTxt.fontSize = 21; diagTxt.height = "42px";
    stR.addControl(diagTxt);

    // -------------------------------------------------------------------------
    // 5. CONTROL Y LÓGICA DE ACTUALIZACIÓN
    // -------------------------------------------------------------------------
    function actualizarSimulacion() {
      const m = calcularMetricas();
      lblSalud.text = `Salud Fisiológica: ${Math.round(m.salud * 100)}%`;
      lblSalud.color = m.salud > 0.7 ? "#15803d" : (m.salud > 0.4 ? "#ca8a04" : "#dc2626");

      puddleMat.alpha = m.ench > 0.05 ? Math.min(0.85, m.ench * 0.95) : 0;
      mound.material.diffuseColor = m.ench > 0.05 ? B.Color3.FromHexString("#4a2e12") : B.Color3.FromHexString("#7a4c22");

      const factorNub = clima.nubosidad / 100;
      scene.clearColor = new B.Color4(0.74 - 0.2 * factorNub, 0.90 - 0.2 * factorNub, 0.97 - 0.15 * factorNub, 1);
    }

    function avanzarDia(d) {
      estadoCrecimiento.dia = d;
      estadoCrecimiento.gdd = Math.max(0, (d - 10) * 9.5);

      if (d <= 6) {
        plantRoot.setEnabled(false);
        estadoCrecimiento.etapa = "SEMILLA (Siembra)";
      } else {
        plantRoot.setEnabled(true);
        estadoCrecimiento.etapa = etapaDe(estadoCrecimiento.gdd);

        let h = 6.6, hojas = 8, esp = true, el = true, grCol = "#ffd21f";
        if (d <= 15) { h = 0.9; hojas = 2; esp = false; el = false; }
        else if (d <= 35) { h = 1.8; hojas = 4; esp = false; el = false; }
        else if (d <= 75) { h = 4.2; hojas = 8; esp = true; el = false; }
        else if (d <= 125) { h = 6.6; hojas = 8; esp = true; el = true; }
        else if (d >= 210) { grCol = "#e09800"; }

        construirMaiz(h, hojas, esp, el, grCol);
      }

      lblDiaC.text = `DÍA: ${Math.round(d)} / 240`;
      lblEtapaC.text = `Etapa: ${estadoCrecimiento.etapa}`;
      sliderDiaC.value = d;

      document.getElementById("badgeDia").textContent = `Día ${Math.round(d)} / 240`;
      document.getElementById("badgeEtapa").textContent = estadoCrecimiento.etapa;
      document.getElementById("sliderDiaHud").value = d;
    }

    function irADiaManual(d) {
      avanzarDia(d);
    }

    function replantar() {
      estadoCrecimiento.timeLapseActivo = false;
      document.getElementById("btnPlayPause").textContent = "▶ Iniciar";
      btnPlayC.textBlock.text = "▶ INICIAR";
      avanzarDia(163);
    }

    function togglePlay() {
      estadoCrecimiento.timeLapseActivo = !estadoCrecimiento.timeLapseActivo;
      document.getElementById("btnPlayPause").textContent = estadoCrecimiento.timeLapseActivo ? "⏸ Pausar" : "▶ Iniciar";
      btnPlayC.textBlock.text = estadoCrecimiento.timeLapseActivo ? "⏸ PAUSAR" : "▶ INICIAR";
      btnPlayC.background = estadoCrecimiento.timeLapseActivo ? "#f59e0b" : "#10b981";
    }

    // -------------------------------------------------------------------------
    // 6. ENLACE CON HUD HTML
    // -------------------------------------------------------------------------
    document.getElementById("chkRotacion").onchange = (e) => {
      cam.useAutoRotationBehavior = e.target.checked;
      if (e.target.checked) cam.autoRotationBehavior.idleRotationSpeed = 0.25;
    };
    document.getElementById("sliderViento").oninput = (e) => {
      clima.viento = +e.target.value;
      document.getElementById("valViento").textContent = `${clima.viento.toFixed(1)} m/s`;
    };
    document.getElementById("btnPlayPause").onclick = togglePlay;
    document.getElementById("sliderDiaHud").oninput = (e) => irADiaManual(+e.target.value);
    document.getElementById("chkConsolasVR").onchange = (e) => {
      panelesMesh.forEach((p) => p.setEnabled(e.target.checked));
    };

    const chips = ["btnFocoPlanta", "btnFocoElote", "btnFocoEspiga", "btnFocoRaices"];
    function setChip(id) {
      chips.forEach((c) => document.getElementById(c).classList.toggle("active", c === id));
    }
    document.getElementById("btnFocoPlanta").onclick = () => { cam.setTarget(V(0, 3.8, 0)); cam.radius = 14.5; setChip("btnFocoPlanta"); };
    document.getElementById("btnFocoElote").onclick = () => { cam.setTarget(V(0.15, 3.2, 0)); cam.radius = 4.2; setChip("btnFocoElote"); };
    document.getElementById("btnFocoEspiga").onclick = () => { cam.setTarget(V(0, 6.4, 0)); cam.radius = 4.5; setChip("btnFocoEspiga"); };
    document.getElementById("btnFocoRaices").onclick = () => { cam.setTarget(V(0, 0.45, 0)); cam.radius = 3.5; setChip("btnFocoRaices"); };

    // Bucle de render y animación
    let tTime = 0;
    scene.registerBeforeRender(() => {
      const dt = engine.getDeltaTime() / 1000;
      tTime += dt;
      const w = clima.viento / 5.0;

      if (estadoCrecimiento.timeLapseActivo) {
        let d = estadoCrecimiento.dia + dt * estadoCrecimiento.velocidad;
        if (d > 240) { d = 240; togglePlay(); }
        avanzarDia(d);
      }

      plantRoot.rotation.z = Math.sin(tTime * 1.8) * 0.015 * w;
      plantRoot.rotation.x = Math.cos(tTime * 1.3) * 0.01 * w;
      leaves.forEach((l) => {
        l.node.rotation.z = Math.sin(tTime * 1.3 + l.ph) * l.amp * w;
        l.node.rotation.x = Math.cos(tTime * 0.9 + l.ph) * 0.03 * w;
      });
      if (tasselNode) {
        tasselNode.rotation.z = Math.sin(tTime * 1.1) * 0.06 * w;
      }
      clouds.forEach((c) => {
        c.position.x += dt * (0.2 + 0.3 * w);
        if (c.position.x > 24) c.position.x = -24;
      });
    });

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
    avanzarDia(163);
  </script>
</body>
</html>
